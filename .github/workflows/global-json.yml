name: Validate JSON

on:
  push:
    paths:
      - '**/*.json'
  pull_request:
    paths:
      - '**/*.json'

permissions:
  contents: read

jobs:
  validate-json:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'

      - name: Validate changed JSON files
        run: |
          echo "Validating modified JSON files..."
          FILES=$(git diff --name-only --diff-filter=AMR ${{ github.event.before }} ${{ github.sha }} | grep '\.json$' || true)
          
          if [ -z "$FILES" ]; then
            echo "No JSON files to validate."
            exit 0
          fi

          ERRORS=0
          for file in $FILES; do
            echo "Checking $file"
            if ! python -m json.tool "$file" > /dev/null 2>&1; then
              echo "❌ Invalid JSON: $file"
              ERRORS=1
            else
              echo "✅ Valid JSON: $file"
            fi
          done

          if [ $ERRORS -ne 0 ]; then
            echo "One or more JSON files are invalid."
            exit 1
          fi
