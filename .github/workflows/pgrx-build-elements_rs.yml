name: PGRX Build

on:
  push:
    paths:
      - 'web/web_common/elements_rs/**'
  pull_request:
    paths:
      - 'web/web_common/elements_rs/**'

permissions:
  contents: read

jobs:
  call-build:
    uses: ./.github/workflows/pgrx-build-template.yml
    with:
      path: web/web_common/elements_rs
